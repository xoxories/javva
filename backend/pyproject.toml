[project]
name = "javva-backend"
version = "0.1.0"
description = "Javva backend — FastAPI service for the AI customer support agent."
requires-python = ">=3.11,<3.12"
authors = [
    { name = "xoxories", email = "afrian887766@gmail.com" }
]
dependencies = [
    "fastapi>=0.136.1",
    "google-genai>=1.74.0",
    "httpx>=0.28.1",
    "langfuse>=4.5.1",
    "matplotlib>=3.10.9",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.0",
    "pydantic-ai>=1.90.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "qdrant-client>=1.17.1",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.46.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "faker>=40.15.0",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
